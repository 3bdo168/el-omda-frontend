<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Warehouse building body -->
  <path d="M32 4L6 22V60H58V22L32 4Z" fill="#059669"/>
  <!-- Roof ridge accent -->
  <path d="M32 4L6 22" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  <path d="M32 4L58 22" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  <!-- Large warehouse door -->
  <rect x="22" y="34" width="20" height="26" rx="3" fill="#ffffff"/>
  <!-- Door divider -->
  <line x1="32" y1="34" x2="32" y2="60" stroke="#059669" stroke-width="1.8"/>
  <!-- Door handles -->
  <circle cx="29" cy="48" r="1.5" fill="#059669"/>
  <circle cx="35" cy="48" r="1.5" fill="#059669"/>
  <!-- Stacked boxes - left side -->
  <rect x="8" y="42" width="12" height="12" rx="2" fill="#10b981" stroke="#ffffff" stroke-width="1.8"/>
  <rect x="10" y="48" width="8" height="0" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <!-- Stacked boxes - right side -->
  <rect x="44" y="42" width="12" height="12" rx="2" fill="#10b981" stroke="#ffffff" stroke-width="1.8"/>
  <!-- Upper boxes - left -->
  <rect x="9" y="29" width="11" height="11" rx="2" fill="#34d399" stroke="#ffffff" stroke-width="1.8"/>
  <!-- Upper boxes - right -->
  <rect x="44" y="29" width="11" height="11" rx="2" fill="#34d399" stroke="#ffffff" stroke-width="1.8"/>
  <!-- Roof window -->
  <rect x="25" y="14" width="14" height="10" rx="2.5" fill="#ffffff" opacity="0.92"/>
  <!-- Window cross bars -->
  <line x1="32" y1="14" x2="32" y2="24" stroke="#059669" stroke-width="1.5"/>
  <line x1="25" y1="19" x2="39" y2="19" stroke="#059669" stroke-width="1.5"/>
  <!-- Subtle up arrow (growth/wholesale) on roof -->
  <path d="M32 8L28 13H36L32 8Z" fill="#34d399" opacity="0.7"/>
</svg>
